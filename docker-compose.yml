services:
  api:
    # T023（US5 一键环境）：context 扩到仓库根，使 Dockerfile 能 COPY alembic/ 与 scripts/seed.py 进镜像（自包含）
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: onehub-api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    # T023：容器启动串「alembic 迁移 → 幂等种子（T007，重复启动零副作用）」后 exec uvicorn。
    # PYTHONPATH=/app：镜像内 project root 即 /app（seed.py 的 backend 相对定位在本布局下不适用）
    command: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && export PYTHONPATH=/app && /app/.venv/bin/python /app/scripts/seed.py && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  pg:
    image: postgres:16-alpine
    container_name: onehub-pg
    environment:
      POSTGRES_USER: onehub
      POSTGRES_PASSWORD: onehub
      POSTGRES_DB: onehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehub -d onehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onehub-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata: